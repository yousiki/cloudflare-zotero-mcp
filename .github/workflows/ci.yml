name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

      # Catches Workers-incompatible imports and bundle-size regressions, and
      # needs no Cloudflare credentials.
      - run: bun x wrangler deploy --dry-run --outdir=.wrangler/ci
